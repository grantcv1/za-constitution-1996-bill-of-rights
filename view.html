<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Constitution of South Africa, 1996</title>
<meta name="description" content="The Preamble and Bill of Rights of the Constitution of South Africa, in Akoma Ntoso, set line for line as printed in the Government Gazette of 18 December 1996.">
<link rel="stylesheet" href="constitution-of-south-africa-1996-bill-of-rights.css">
<style>
html,html>body{margin:0;background:#3a3a38;overflow-x:hidden}
#stack{display:flex;flex-direction:column;align-items:center;gap:22px;padding:22px 0 10px}
.page{box-sizing:border-box;width:800px;min-height:1120px;padding:34px 66px 44px;background:#fdfdfb;box-shadow:0 2px 10px rgba(0,0,0,.45);color:#111;font:400 16.6px/1.36 "Body",Georgia,serif}
.hd{font:400 11.5px/1.2 "Body",serif;margin-bottom:6px}
.hd .a{display:flex;justify-content:space-between;padding:0 6px 4px;border-bottom:1.5px solid #111}
.hd .b{display:flex;justify-content:center;gap:56px;padding-top:4px;font-size:10.5px}
.hd .c{margin-top:5px;padding-bottom:3px;border-bottom:1.5px solid #111;text-align:right;font-style:italic;font-size:13px}
.hd b{font-size:12px}
.l{display:block;white-space:nowrap}
.page p{display:block;margin:0}
.page section{display:block;margin-top:.85em;padding-left:30px}
.page section>heading{margin-left:-30px;font:900 15.5px/1.2 "Head",sans-serif;break-after:avoid}
.page section>num{display:none}
.page subsection,.page point{display:block;position:relative;padding-left:27px}
.page subsection{margin-top:.5em}
.page point{margin-top:.08em}
.page point point{padding-left:33px}
.page subsection>num,.page point>num{display:block;position:absolute;left:0}
.page intro,.page content,.page list,.page chapter,.page body,.page act,.page preamble,.page hcontainer{display:block}
.secn{position:absolute;left:-30px;top:0}
.anch{position:relative}
.page chapter{margin:0}
.page chapter>num{margin:1.6em 0 .55em;font:900 36px/1.1 "Head",sans-serif;text-align:center}
.page chapter>heading{display:table;margin:0 auto 2.1em;padding:.1em .5em;background:#111;color:#fff;font:400 25px/1.3 "Body",serif}
.page preamble p{font-style:italic;margin:0 0 1.1em 36px;font-size:17px}
.page preamble p[class~="pi"]{margin-left:72px}
.page preamble p[class~="ph"]{font:900 33px/1.1 "Head",sans-serif;font-style:normal;text-align:center;margin:.3em 0 2em}
.page table{margin:.4em 0 1em}
.page table .l{white-space:normal}
.foot{margin:6px 16px 20px;text-align:center;color:#d8d6cc;font:13.5px/1.5 Georgia,serif}
.foot a{color:#fff}
#msg{color:#eee;text-align:center;font:17px Georgia,serif;padding:40px}
</style></head>
<body>
<main id="stack"><p id="msg">Loading…</p></main>
<p class="foot">Set line for line as printed in Government Gazette No. 17678 of 18 December 1996, pages 3 and 7 to 19. Not a facsimile: the type is reset, and this is the text as first published, not as later amended. Akoma Ntoso XML generated by Claude for Grant Vergottini. <a href="constitution-of-south-africa-1996-bill-of-rights.xml">View the XML</a>.</p>
<script>
const AKN='http://docs.oasis-open.org/legaldocml/ns/akn/3.0';
const tag=(r,t)=>[...r.getElementsByTagNameNS(AKN,t)];
(async()=>{try{
await Promise.all(['16px Body','italic 16px Body','900 16px Head','600 16px Narrow'].map(f=>document.fonts.load(f)));
const r=await fetch('constitution-of-south-africa-1996-bill-of-rights.xml');if(!r.ok)throw 0;
const d=new DOMParser().parseFromString(await r.text(),'application/xml');if(d.querySelector('parsererror'))throw 0;
const root=document.importNode(d.documentElement,true);tag(root,'meta').forEach(m=>m.remove());
// hang section numbers beside the first line
for(const s of tag(root,'section')){const n=[...s.children].find(c=>c.localName==='num');const f=[...s.children].find(c=>['subsection','intro','content'].includes(c.localName));const x=document.createElement('span');x.className='secn';x.textContent=n.textContent;f.classList.add('anch');f.insertBefore(x,f.firstChild);n.remove()}
// a real hyphen at a line end
for(const m of [...tag(root,'eol'),...tag(root,'eop')]){const at=+m.getAttribute('breakAt');if(!at)continue;const t=m.nextSibling;const rest=t.splitText(at);t.parentNode.insertBefore(m,rest)}
const line=p=>{const marks=tag(p,'eol').concat(tag(p,'eop')).sort((a,b)=>a.compareDocumentPosition(b)&4?-1:1);const fr=[];
  for(const m of marks){const rg=document.createRange();rg.setStart(p,0);rg.setEndBefore(m);const x=rg.extractContents();m.remove();fr.push(x)}
  const rg=document.createRange();rg.selectNodeContents(p);const tail=rg.extractContents();if(tail.textContent.trim())fr.push(tail);
  fr.forEach(x=>{const s=document.createElement('span');s.className='l';s.appendChild(x);p.appendChild(s)})};
const stack=document.getElementById('stack');stack.textContent='';
for(const e of tag(root,'eop')){const n=+e.getAttribute('number');const rg=document.createRange();rg.setStart(root,0);rg.setEndAfter(e);const f=rg.extractContents();
  const P=document.createElement('section');P.className='page';
  const A=n%2?'<span>GOVERNMENT GAZETTE, 18 DECEMBER 1996</span><span>No. 17678 &nbsp; <b>'+n+'</b></span>':'<span><b>'+n+'</b> &nbsp; No. 17678</span><span>GOVERNMENT GAZETTE, 18 DECEMBER 1996</span>';
  const Bb=n%2?'<span>CONSTITUTION OF THE REPUBLIC OF SOUTH AFRICA, 1996</span><span><b>Act No. 108, 1996</b></span>':'<span><b>Act No. 108, 1996</b></span><span>CONSTITUTION OF THE REPUBLIC OF SOUTH AFRICA, 1996</span>';
  P.innerHTML='<div class="hd"><div class="a">'+A+'</div><div class="b">'+Bb+'</div>'+(n>3?'<div class="c">Chapter 2 – Bill of Rights</div>':'')+'</div>';
  const inn=document.createElement('div');inn.appendChild(f);P.appendChild(inn);tag(inn,'p').filter(p=>!p.closest('table')).forEach(line);stack.appendChild(P)}
const fit=()=>{const k=Math.min(1,(innerWidth-12)/800);document.querySelectorAll('.page').forEach(p=>p.style.zoom=k)};fit();addEventListener('resize',fit);
window.__over=[...document.querySelectorAll('.l')].filter(l=>{const r=document.createRange();r.selectNodeContents(l);const p=l.closest('.page').getBoundingClientRect();return r.getBoundingClientRect().right>p.right-40}).length;
}catch(e){console.error(e);document.getElementById('msg').textContent='The document could not be loaded.'}})();
</script>
</body></html>
